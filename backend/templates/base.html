<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Streamer Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit&family=Montserrat&display=swap" rel="stylesheet">
    <style>
        /* Base styles (light theme) */
        :root {
            --bg-color: #f8f9fa;
            --card-bg: white;
            --text-color: #333;
            --secondary-text: #666;
            --border-color: #ddd;
            --accent-color: #6441a5;
            --hover-bg: rgba(100, 65, 165, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --card-shadow: 0 3px 10px var(--shadow-color);
            --input-bg: white;
            --document-bg: #f9f9f9;
        }
        /* Dark theme variables */
        body.dark-theme {
            --bg-color: #1a1a1a;
            --card-bg: #2a2a2a;
            --text-color: #eee;
            --secondary-text: #b0b0b0;
            --border-color: #444;
            --accent-color: #9147ff;
            --hover-bg: rgba(145, 71, 255, 0.2);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --card-shadow: 0 3px 10px var(--shadow-color);
            --input-bg: #333;
            --document-bg: #2c2c2c;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }
        .full-body-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px;
        }
        .top-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
        }
        .input-box {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin: 10px 0;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            background-color: var(--input-bg);
            box-shadow: 0 2px 8px var(--shadow-color);
        }
        .input-box img {
            width: 20px;
            height: 20px;
        }
        .input-box input {
            flex: 1;
            margin-left: 10px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            color: var(--text-color);
        }
        .size-filter {
            margin-top: 10px;
        }
        .size-filter label {
            margin-right: 5px;
        }
        .size-filter select {
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: var(--input-bg);
            color: var(--text-color);
        }
        #answer-box {
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
        }
        .streamer-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .streamer-header {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .streamer-image {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            border: 2px solid var(--accent-color);
        }
        .streamer-info h3 {
            margin: 0;
            font-family: 'Kanit', sans-serif;
            font-size: 20px;
        }
        .tt-summary,
        .document-list {
            padding: 15px;
        }
        .tt-summary p {
            margin: 5px 0;
            font-size: 14px;
        }
        .document-item {
            background-color: var(--document-bg);
            padding: 10px;
            border-left: 4px solid var(--accent-color);
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .document-item .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--secondary-text);
        }
        .no-results,
        .error {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--secondary-text);
        }
    </style>
</head>
<body class="dark-theme">
    <div class="full-body-container">
        <div class="top-text">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" style="width:120px">
            <div class="input-box">
                <img src="{{ url_for('static', filename='images/mag.png') }}" alt="Search">
                <input id="filter-text-val" placeholder="Search for a Twitch streamer" onkeyup="filterText()">
            </div>
            <div class="size-filter">
                <label for="category-filter">Size:</label>
                <select id="category-filter" onchange="filterText()">
                    <option value="all">All</option>
                    <option value="big">Big (&gt;20,000 avg)</option>
                    <option value="medium">Medium (10,000–20,000)</option>
                    <option value="small">Small (&lt;10,000)</option>
                </select>
            </div>
        </div>
        <div id="answer-box"></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeSwitch = document.getElementById('theme-switch');
            // No explicit theme switch element here; implement if needed
        });
        function filterText() {
            const box = document.getElementById('answer-box');
            box.innerHTML = '';
            const term = document.getElementById('filter-text-val').value;
            const category = document.getElementById('category-filter').value;
            if (!term.trim()) return;
            const params = new URLSearchParams({ name: term });
            if (category && category !== 'all') params.append('category', category);
            fetch('/search?' + params)
                .then(r => r.json())
                .then(data => {
                    if (!data.length) {
                        box.innerHTML = '<div class="no-results">No results found</div>';
                        return;
                    }
                    data.forEach(s => {
                        const card = document.createElement('div');
                        card.className = 'streamer-card';
                        let html = `<div class="streamer-header">
                            <img src="/static/${s.image_path}" onerror="this.src='/static/images/placeholder.jpg'" class="streamer-image" alt="${s.name}">
                            <div class="streamer-info">
                                <h3>${s.name} (${s.category.toUpperCase()})</h3>
                            </div>
                        </div>`;
                        html += '<div class="tt-summary">';
                        if (s.twitchtracker && s.twitchtracker.avg_viewers) {
                            html += `<p>Avg viewers: ${s.twitchtracker.avg_viewers.toLocaleString()}</p>`;
                            html += `<p>Max viewers: ${s.twitchtracker.max_viewers.toLocaleString()}</p>`;
                        } else {
                            html += '<p>No 30-day data.</p>';
                        }
                        html += '</div>';
                        if (s.documents.length) {
                            html += '<div class="document-list">';
                            s.documents.forEach(d => {
                                html += `<div class="document-item"><p>${d.doc}</p><div class="meta-info"><span>Source: ${d.source}</span><span>Score: ${d.sim_score}</span></div></div>`;
                            });
                            html += '</div>';
                        }
                        card.innerHTML = html;
                        box.appendChild(card);
                    });
                })
                .catch(err => console.error(err));
        }
    </script>
</body>
</html>
